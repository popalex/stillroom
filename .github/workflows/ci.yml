name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      # pnpm skips better-sqlite3's install script, so check that its packaged binary loads.
      - run: node --input-type=module -e 'import Database from "better-sqlite3"; const db = new Database(":memory:"); db.exec("SELECT 1"); db.close();'
      - run: pnpm format:check
      - run: pnpm build
      - run: pnpm test
      - run: pnpm exec playwright install --with-deps chromium
      - run: pnpm test:e2e
      - if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: playwright-results
          path: |
            test-results/
            playwright-report/
          if-no-files-found: ignore
          retention-days: 14

  docker:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Dependabot bumps packageManager but not the Dockerfile's corepack line.
      - name: Check the Dockerfile's pnpm version
        run: |
          want=$(node -p 'require("./package.json").packageManager.split("+")[0]')
          bad=$(grep -o 'pnpm@[^ ]*' Dockerfile | grep -vxF "$want" || true)
          if [ -n "$bad" ]; then
            echo "::error file=Dockerfile::Dockerfile prepares $bad but package.json has $want"
            exit 1
          fi
      - run: docker build --pull .
